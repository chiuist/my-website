const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const selected = new Set(JSON.parse(localStorage.getItem('arpg-outreach-selected') || '[]'));
let showSelectedOnly = false;
const search = document.getElementById('search');
const category = document.getElementById('category');
const product = document.getElementById('product');
const fit = document.getElementById('fit');
const tbody = document.getElementById('tbody');
const tabs = document.getElementById('tabs');
const categories = ['全部','圈主/运营','垂直社区','内容创作者'];
function count(type){return entries.filter((entry)=>entry.category===type).length}
function renderTabs(){tabs.innerHTML=categories.map((item)=>'<button class="tab '+(category.value===item?'active':'')+'" data-category="'+esc(item)+'">'+esc(item)+' '+(item==='全部'?entries.length:count(item))+'</button>').join('');tabs.querySelectorAll('button').forEach((button)=>button.onclick=()=>{category.value=button.dataset.category;render()})}
function filtered(){const q=search.value.trim().toLowerCase();return entries.filter((entry)=>{if(category.value!=='全部'&&entry.category!==category.value)return false;if(product.value!=='全部'&&!entry.product.toLowerCase().includes(product.value.toLowerCase()))return false;if(fit.value!=='全部'&&entry.fit!==fit.value)return false;if(showSelectedOnly&&!selected.has(entry.id))return false;if(!q)return true;return [entry.name,entry.platform,entry.product,entry.activity,entry.route,entry.angle,entry.risk].join(' ').toLowerCase().includes(q)})}
function toggle(id,checked){checked?selected.add(id):selected.delete(id);localStorage.setItem('arpg-outreach-selected',JSON.stringify([...selected]));render()}
function render(){renderTabs();const rows=filtered();document.getElementById('managerCount').textContent=count('圈主/运营');document.getElementById('communityCount').textContent=count('垂直社区');document.getElementById('creatorCount').textContent=count('内容创作者');document.getElementById('selectedCount').textContent=selected.size;document.getElementById('selectedOnly').textContent=showSelectedOnly?'显示全部':'仅看已选';tbody.innerHTML=rows.length?rows.map((entry)=>'<tr class="'+(selected.has(entry.id)?'selected':'')+'"><td><input type="checkbox" data-id="'+esc(entry.id)+'" '+(selected.has(entry.id)?'checked':'')+'></td><td><b>'+esc(entry.category)+'</b><div class="meta">'+esc(entry.platform)+'</div></td><td><a class="name" href="'+esc(entry.url)+'" target="_blank" rel="noreferrer">'+esc(entry.name)+'</a><div class="small">'+esc(entry.route)+'</div></td><td>'+esc(entry.product)+'</td><td class="small">'+esc(entry.activity)+'</td><td>'+esc(entry.angle)+'</td><td><span class="pill '+(entry.fit==='高'?'fit-high':'fit-mid')+'">'+esc(entry.fit)+'匹配</span><div class="small">'+esc(entry.risk)+'</div></td></tr>').join(''):'<tr><td class="empty" colspan="7">没有符合当前筛选条件的条目</td></tr>';tbody.querySelectorAll('input[type=checkbox]').forEach((input)=>input.onchange=()=>toggle(input.dataset.id,input.checked))}
function csvCell(value){const text=String(value).replace(/"/g,'""');return '"'+text+'"'}
function exportCsv(){const rows=filtered();const headers=['类型','平台','名称','公开链接','覆盖产品','公开私聊入口','活跃证据','建议触达角度','匹配度','风险'];const csv='\ufeff'+[headers,...rows.map((e)=>[e.category,e.platform,e.name,e.url,e.product,e.route,e.activity,e.angle,e.fit,e.risk])].map((row)=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ARPG建联储备_当前筛选.csv';a.click();URL.revokeObjectURL(url)}
[search,category,product,fit].forEach((element)=>element.addEventListener(element===search?'input':'change',render));document.getElementById('selectedOnly').onclick=()=>{showSelectedOnly=!showSelectedOnly;render()};document.getElementById('export').onclick=exportCsv;render();
</script>
